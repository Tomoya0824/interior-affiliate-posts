<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Auth Callback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>認証の確認</h1>
      <p class="muted">Room Totonoe ／ Threads・Pinterestの連携用ページ</p>
    </header>

    <div class="card" id="result">
      <p>このページは、ThreadsやPinterestで「許可」を押したあとに表示されます。</p>
    </div>

    <p class="muted">このページは表示されたコードをどこにも送信しません。コードは一度しか使えず、短時間で無効になります。</p>

    <footer>
      <p><a href="./">ホーム</a> ・ <a href="privacy.html">プライバシーポリシー</a></p>
    </footer>
  </main>

  <script>
    (function () {
      var box = document.getElementById('result');
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var state = params.get('state');

      function clear() { while (box.firstChild) box.removeChild(box.firstChild); }
      function add(tag, text, cls) {
        var el = document.createElement(tag);
        el.textContent = text;
        if (cls) el.className = cls;
        box.appendChild(el);
        return el;
      }

      if (error) {
        clear();
        add('p', '連携はキャンセルされたか、失敗しました。');
        add('span', error + (params.get('error_description') ? '：' + params.get('error_description') : ''), 'code');
        return;
      }
      if (!code) return;

      code = code.replace(/#_$/, '');
      clear();
      add('p', '連携の許可が完了しました。下のコードをコピーして、Apps Scriptの設定画面に貼り付けてください。');
      add('span', code, 'code');
      if (state) add('p', '連携先：' + state, 'muted');
      var btn = add('button', 'コードをコピー');
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(code).then(function () {
          btn.textContent = 'コピーしました';
        }, function () {
          btn.textContent = 'コピーできませんでした。手動で選択してください';
        });
      });

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
